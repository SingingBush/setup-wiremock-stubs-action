name: Setup Wiremock Stubs

# description must be less than 125 characters
description: Post Wiremock stubs to an already running Wiremock container running as a GH service
author: singingbush

# Add your action's branding here. This will appear on the GitHub Marketplace.
# See https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#branding
branding:
  icon: command
  color: gray-dark

# Define your inputs here.
inputs:
  hostname:
    description: The host name for your Wiremock server. (defaults to localhost)
    required: true
    default: 'localhost'
  port:
    description: The port number for your Wiremock server. (defaults to 8080)
    required: true
    default: '8080'
  mappings:
    description: The path to the directory containing your Wiremock mappings.
    required: true

# Define your outputs here.
outputs:
  mappings:
    description: array of mappings configured on the Wiremock server
  total:
    description: The amount of mappings that have been configured

runs:
  using: node24
  # pre: 'dist/setup.js'
  main: dist/index.js
  # post: 'dist/cache-save/index.js'
  # post-if: success()
